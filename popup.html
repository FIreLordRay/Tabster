<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tabster</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title">
      <strong>Tabster</strong>
      <span id="totalCount" class="muted"></span>
    </div>
    <div class="actions">
      <label class="switch" title="Auto-sort new tabs">
        <input type="checkbox" id="autoSortToggle" />
        <span>Auto-sort</span>
      </label>
      <button id="sortNowBtn">Sort now</button>
      <button id="optionsBtn" title="Manage categories">⚙</button>
    </div>
  </header>
  <main id="groups"></main>
  <p id="emptyState" class="muted" hidden>No tabs found.</p>
  <script src="popup.js"></script>
</body>
</html>
