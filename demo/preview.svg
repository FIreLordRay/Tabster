<svg viewBox="0 0 420 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#dde3ea"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#141e32" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="420" height="520" fill="url(#bg)"/>

  <g filter="url(#cardShadow)">
    <rect x="40" y="30" width="340" height="460" rx="10" fill="#ffffff" stroke="#d8dadd"/>
  </g>

  <!-- header -->
  <text x="56" y="58" font-size="14" font-weight="700" fill="#1a1a1a">Tabster</text>
  <text x="108" y="58" font-size="12" fill="#6b7280">27 tabs</text>

  <rect x="56" y="68" width="14" height="14" rx="3" fill="#2563eb"/>
  <path d="M59 75 l3 3 l6 -7" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="76" y="79" font-size="12" fill="#6b7280">Auto-sort</text>

  <rect x="248" y="66" width="68" height="22" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="282" y="80" font-size="11" fill="#1a1a1a" text-anchor="middle">Sort now</text>

  <rect x="322" y="66" width="30" height="22" rx="6" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="337" y="81" font-size="12" fill="#6b7280" text-anchor="middle">&#9881;</text>

  <line x1="40" y1="98" x2="380" y2="98" stroke="#e5e7eb"/>

  <!-- category: Development -->
  <g>
    <circle cx="64" cy="118" r="4.5" fill="#4285f4"/>
    <text x="76" y="122" font-size="12.5" font-weight="600" fill="#1a1a1a">Development</text>
    <text x="360" y="122" font-size="11" fill="#6b7280" text-anchor="end">4</text>

    <text x="64" y="144" font-size="11.5" fill="#1a1a1a">FIreLordRay/Tabster — GitHub</text>
    <text x="64" y="164" font-size="11.5" fill="#1a1a1a">Stack Overflow — chrome.tabGroups API</text>
    <text x="64" y="184" font-size="11.5" fill="#1a1a1a">MDN — Service Workers</text>
    <text x="64" y="204" font-size="11.5" fill="#1a1a1a">localhost:5173 — Vite dev server</text>
  </g>

  <line x1="40" y1="216" x2="380" y2="216" stroke="#e5e7eb"/>

  <!-- category: AI Tools -->
  <g>
    <circle cx="64" cy="236" r="4.5" fill="#a142f4"/>
    <text x="76" y="240" font-size="12.5" font-weight="600" fill="#1a1a1a">AI Tools</text>
    <text x="360" y="240" font-size="11" fill="#6b7280" text-anchor="end">2</text>

    <text x="64" y="262" font-size="11.5" fill="#1a1a1a">Claude</text>
    <text x="64" y="282" font-size="11.5" fill="#1a1a1a">ChatGPT</text>
  </g>

  <line x1="40" y1="294" x2="380" y2="294" stroke="#e5e7eb"/>

  <!-- category: Social -->
  <g>
    <circle cx="64" cy="314" r="4.5" fill="#ff6ec7"/>
    <text x="76" y="318" font-size="12.5" font-weight="600" fill="#1a1a1a">Social</text>
    <text x="360" y="318" font-size="11" fill="#6b7280" text-anchor="end">3</text>

    <text x="64" y="340" font-size="11.5" fill="#1a1a1a">reddit.com/r/webdev</text>
    <text x="64" y="360" font-size="11.5" fill="#1a1a1a">X / Twitter</text>
    <text x="64" y="380" font-size="11.5" fill="#1a1a1a">LinkedIn</text>
  </g>

  <line x1="40" y1="392" x2="380" y2="392" stroke="#e5e7eb"/>

  <!-- category: Shopping -->
  <g>
    <circle cx="64" cy="412" r="4.5" fill="#fa903e"/>
    <text x="76" y="416" font-size="12.5" font-weight="600" fill="#1a1a1a">Shopping</text>
    <text x="360" y="416" font-size="11" fill="#6b7280" text-anchor="end">1</text>

    <text x="64" y="438" font-size="11.5" fill="#1a1a1a">Amazon — USB-C hub</text>
  </g>

  <line x1="40" y1="450" x2="380" y2="450" stroke="#e5e7eb"/>

  <!-- category: Productivity (collapsed, chevron rotated) -->
  <g>
    <circle cx="64" cy="470" r="4.5" fill="#34a853"/>
    <text x="76" y="474" font-size="12.5" font-weight="600" fill="#1a1a1a">Productivity</text>
    <text x="352" y="474" font-size="11" fill="#6b7280" text-anchor="end">3</text>
    <text x="368" y="474" font-size="10" fill="#9aa0a6" text-anchor="end">&#9656;</text>
  </g>
</svg>
